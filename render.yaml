# Blueprint Render : un service web Node.js + une base PostgreSQL.
# Sur Render : New > Blueprint > choisir ce dépôt. Render demandera OWNER_PASSWORD.
services:
  - type: web
    name: restaurant-gestion
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: proprietaire
      - key: OWNER_PASSWORD
        sync: false
      - key: RESTAURANT_NAME
        value: La Belle Table
      - key: CURRENCY
        value: FCFA
      - key: SEED_DEMO
        value: "false"

databases:
  - name: restaurant-db
    plan: free
    region: frankfurt
    databaseName: restaurant
    user: restaurant
